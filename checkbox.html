<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>
	<h2>Formularios con checkbox</h2> <!-- título del body -->
	<form action="" method="post"> <!-- abre un formulario -->
		Ingresa tu nombre: <!-- pide ingresar nombre -->
		<input type="text" name="nombre"> <!-- habilita un cuadro dónde ingresar la peticion -->

		<br>
		Selecciona los lenguajes que conozcas: <!-- pide seleccionar una o varias opciones -->
		<br>
		<input type="checkbox" name="Java">Java <br> <!-- habilita un cuadro dónde seleccionar -->
		<input type="checkbox" name="Python"> Python <br> <!-- habilita un cuadro dónde seleccionar -->
		<input type="checkbox" name="C#">C# <br> <!-- habilita un cuadro dónde seleccionar -->
		<input type="checkbox" name="Flutter"> Flutter <br> <!-- habilita un cuadro dónde seleccionar -->
	</form>
</body>
</html>
