<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>
	<h2>Formularios con seleccion</h2> <!-- título del body -->
	<form action="" method="post"> <!-- abre un formulario -->
		Ingresa tu nombre: <!-- pide ingresar nombre -->
		<input type="text" name="nombre"> <!-- habilita un cuadro dónde ingresar la peticion -->
		<br>
		Selecciona tu pais: <!-- pide seleccionar una opcion -->
		<select name="pais"> <!-- habilita un cuadro dónde seleccionar la opcion -->
			<option value="1">Argentina</option> <!-- habilita una opcion -->
			<option value="2">España</option> <!-- habilita una opcion -->
			<option value="3">Mexico</option> <!-- habilita una opcion -->
			<option value="4">Guatemala</option> <!-- habilita una opcion -->
			<option value="5">Honduras</option> <!-- habilita una opcion -->
			<option value="6">El Salvador</option> <!-- habilita una opcion -->
			<option value="7">Venezuela</option> <!-- habilita una opcion -->
			<option value="8">Colombia</option> <!-- habilita una opcion -->
		</select>
		<br>
		<input type="submit" value="enviar"> <!-- botón que permite enviar la petición -->
		<input type="reset" value="borrar"> <!-- botón que permite borrar la petición -->
	</form>
</body>
</html>
