<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>
<h2>Formularios con agrupamiento</h2> <!-- título del body -->
	<form action="" method="post"> <!-- abre un formulario -->
	<fieldset> <!-- crea un "grupo" -->
		<legend>Datos personales</legend> <!-- Leyenda es el título del grupo -->
		Nombre y apellido: <!-- pide ingresar nombre y apellido -->
		<input type="text" name="nombre_apellido"><br> <!-- habilita un cuadro dónde ingresar la peticion -->
		Documento valido: <!-- pide ingresar documento -->
		<input type="file" name="documento"><br> <!-- habilita un cuadro dónde ingresar la peticion -->
		Fecha de nacimiento: <!-- pide fecha de nacimiento -->

		<input type="date" name="fecha_nacimiento"> <!-- habilita un cuadro dónde ingresar la peticion -->
	</fieldset>
	<fieldset> <!-- crea un "grupo" -->
		<legend>Datos de estudio:</legend> <!-- Leyenda es el título del grupo -->
		Nombre de la escuela: <!-- pide ingresar nombre de escuela -->
		<input type="text" name="escuela"><br> <!-- habilita un cuadro dónde ingresar la peticion -->
		Certificado valido: <!-- pide ingresar certificado -->
		<input type="file" name="certificado"><br> <!-- habilita un cuadro dónde ingresar la peticion -->
		Fecha de egreso: <!-- pide ingresar fecha de egreso -->
		<input type="date" name="fecha_egreso"> <!-- habilita un cuadro dónde ingresar la peticion -->
	</fieldset>
		<br>
		<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- botón que permite enviar la petición -->
		<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- botón que permite borrar la petición -->
	</form>
</body>
</html>
