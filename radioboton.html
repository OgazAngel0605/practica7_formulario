<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>
	<h2>Formularios con Radioboton</h2> <!-- título del body -->
	<form action="" method="post"> <!-- abre un formulario -->
		Ingresa tu nombre: <!-- pide ingresar nombre -->
		<input type="text" name="nombre"> <!-- habilita un cuadro dónde ingresar la peticion -->
		<br>
		Selecciona el maximo de estudios que tienes: <!-- pide seleccionar una opcion -->
		<br>
		<input type="radio" name="estudios" value="1">Sin estudios <br> <!-- habilita un circulo dónde seleccionar -->
		<input type="radio" name="estudios" value="2">Primaria <br> <!-- habilita un circulo dónde seleccionar -->
		<input type="radio" name="estudios" value="3">Secundaria <br> <!-- habilita un circulo dónde seleccionar -->
		<input type="radio" name="estudios" value="4">Preparatoria <br> <!-- habilita un circulo dónde seleccionar -->
		<input type="submit" value="enviar"> <!-- botón que permite enviar la petición -->
		<input type="reset" value="borrar"> <!-- botón que permite borrar la petición -->
	</form>
</body>
</html>
