<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>
	<h2>Formulario para contraseñas</h2> <!-- título del body -->
	<form action="" method="post"> <!-- abre un formulario -->
		Ingresa tu usuario: <!-- pide ingresar nombre -->
		<input type="text" name="usuario"> <!-- habilita un cuadro dónde ingresar la peticion -->
		Ingresa tu contraseña: <!-- pide ingresar contraseña -->
		<input type="password" name="pass"> <!-- habilita un cuadro dónde ingresar la peticion -->
		<br>
		<input type="submit" value="enviar"> <!-- botón que permite enviar la petición -->
		<input type="reset" value="borrar"> <!-- botón que permite borrar la petición -->
	</form>
</body>
</html>
